name: Build iOS IPAs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build iOS IPA Binaries
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Latest Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build CalculatorVault (Target Phone App)
        run: |
          xcodebuild -project PhotoVaultSuite.xcodeproj \
                     -scheme CalculatorVault \
                     -configuration Release \
                     -sdk iphoneos \
                     -derivedDataPath derived_data_calc \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     clean build

      - name: Verify and Package CalculatorVault.ipa
        run: |
          mkdir -p Payload
          cp -r derived_data_calc/Build/Products/Release-iphoneos/CalculatorVault.app Payload/
          /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryUsageDescription 'To load local cache and themes.'" Payload/CalculatorVault.app/Info.plist 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'To load local cache and themes.'" Payload/CalculatorVault.app/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryAddUsageDescription 'To save calculation receipts and cache.'" Payload/CalculatorVault.app/Info.plist 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryAddUsageDescription string 'To save calculation receipts and cache.'" Payload/CalculatorVault.app/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UILaunchScreen dict" Payload/CalculatorVault.app/Info.plist 2>/dev/null || true
          zip -qr CalculatorVault.ipa Payload
          rm -rf Payload

      - name: Build AdminVault (Controller Phone App)
        run: |
          xcodebuild -project PhotoVaultSuite.xcodeproj \
                     -scheme AdminVault \
                     -configuration Release \
                     -sdk iphoneos \
                     -derivedDataPath derived_data_admin \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     clean build

      - name: Verify and Package AdminVault.ipa
        run: |
          mkdir -p Payload
          cp -r derived_data_admin/Build/Products/Release-iphoneos/AdminVault.app Payload/
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryAddUsageDescription string 'Permission needed to save photos.'" Payload/AdminVault.app/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UILaunchScreen dict" Payload/AdminVault.app/Info.plist 2>/dev/null || true
          zip -qr AdminVault.ipa Payload
          rm -rf Payload

      - name: Upload Calculator IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CalculatorVault-IPA
          path: CalculatorVault.ipa

      - name: Upload Admin IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AdminVault-IPA
          path: AdminVault.ipa
